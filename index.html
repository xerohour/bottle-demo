ou\u2019ll be off like new!","The keep\u2019s cook trusted me with his secret: a pinch of sea salt, and lots of love."],["Stay a while, won\u2019t you? Rushed customers forget to savor, and that makes me sad.","The keep\u2019s kitchens used to feed a hundred mouths. These days it\u2019s just us... and that\u2019s just fine."]]},{name:"Barnab\xE9",tone:"bougon, ronchon",specialty:'Shells "at buddy prices"',lines:[["What do you want? My shells are at buddy prices. No buddy, no price.","The lord raised the stall taxes again. Soon he\u2019ll tax the air we breathe, you\u2019ll see."],["Back again? Fine... for you, I\u2019ll make an effort. But don\u2019t tell anyone.","I paid my tax in shells this morning. The collector made a face. So did I, actually."],["You know what? You\u2019re starting to grow on me. A little. Not too much, though, let\u2019s not overdo it.","They say the lord keeps his coins in the keep. I keep my shells. To each their own treasure."]]},{name:"Pipo",tone:"feignant, tra\xEEne ses mots",specialty:"Red bottle caps",lines:[["Ooooh... hey... Want a red cap? They\u2019re... red... yeah...","Me, I nap under my stall. It\u2019s cool... and nobody bothers me... well, except you, right now..."],["You\u2019re back already...? Time flies when you sleep... Take a cap, it wakes you up... so they say...","Under the stalls you can hear the whole castle purring. It\u2019s like a giant lullaby... zzz..."],["Shhh... I\u2019m meditating... I think... Red caps bring sleepers luck, they say...","Once I slept through a whole party at the keep. Woke up at the end. Perfect, right? I didn\u2019t miss a thing... well, except everything."]]},{name:"C\xE9lestine",tone:"pr\xE9cieuse, mani\xE9r\xE9e",specialty:"Mother-of-pearl shells",lines:[["Oh! A visitor! Admire my mother-of-pearl shells, they\u2019re so... exquisite.","At the keep\u2019s ball last year, my mother-of-pearl set outshone the chandelier itself. People still talk about it."],["Back again, darling. Have you noticed how mother-of-pearl catches the light? A true mirror of good taste.","For the next ball at the keep, I demand a shrimp orchestra. The lord is hesitating... he\u2019ll give in eventually."],["Did you know mother-of-pearl shines brighter with compliments? So don\u2019t be shy, flatter my shells.","They say a prince came to the ball incognito. I recognized him by his polished claws. Style never lies."]]},{name:"Gaston",tone:"bourru mais tendre",specialty:'"Armored" cans',lines:[["Don\u2019t come too close... well, actually, come here. My armored cans can take anything. Even me.","I held the castle gate during the great seagull battle. Three days! Well... three hours."],["Hey, kid. You look tough. Here, an armored can, on the house. Shh.","At the gate, guard duty was no joke. But in the evening we shared our soup. Those were the days."],["You\u2019ll come see me again, huh? Careful, I might get attached. And an attached Gaston is dangerous.","The gate held because of us. The castle will hold, as long as there are strong hearts inside."]]},{name:"L\xE9o",tone:"press\xE9, parle vite",specialty:'Bottle caps "limited edition"',lines:[["Quickquickquick! Limited edition caps, only three left, gone in ten seconds, hurry!","I run in the courtyard every morning, broke my record yesterday, twelve laps, the chickens cheered!"],["Back already?! Perfect, I love fast customers! Here, a cap, go, run!","The castle courtyard is my racetrack! I slalom between the stalls with my eyes closed! Well, almost!"],["Final sale, ultra limited, in five seconds I pack it all up, four, three... fine, for you I\u2019ll stay.","One day I\u2019ll run all the way to the top of the keep! The lord told me: slow down. I slowed down... for two seconds!"]]},{name:"Granny Seaweed",tone:"fatigu\xE9e, sage",specialty:"Dried seaweed",lines:[["Sit down, little one... My dried seaweed tastes like time passing. Slowly.","You know, the castle... before, when it was small, it was just a pile of sand and a child\u2019s dream."],["Come see me when the wind tires you. I\u2019ll always have some seaweed and a story for you.","The walls grew grain by grain. And every grain knew a loving hand, remember that."],["My old claws tremble, but my heart is strong. Take this seaweed, it\u2019ll bring you luck.","The castle was small, but the dreams were big. Never forget that, little Bernardo."]]},{name:"Oscar",tone:"myst\xE9rieux, chuchote",specialty:'Cans "fallen from the sky"',lines:[["Psst... over here... My cans fell from the sky. Don\u2019t ask how. Nobody knows.","Tunnels run under the castle... They whisper at night. Listen closely, you\u2019ll hear them."],["You came back... The shadows let you through. That\u2019s a good sign. A very good sign.","The tunnels lead everywhere... and nowhere. I\u2019ve seen things there I\u2019ll only tell the moon."],["Last visit? No... we\u2019ll meet again. Cans fallen from the sky choose their keepers.","If the portcullis ever closes behind you, follow the drafts. They know the way out. So do I."]]},{name:"Colette",tone:"enthousiaste",specialty:"Dried starfish",lines:[["Welcome, welcome! My dried starfish bring luck, scientifically proven by myself!","Seen the portcullis? It weighs a ton! One day I\u2019ll decorate it with my starfish, it\u2019ll be gorgeous."],["You\u2019re back! I saved the prettiest starfish for you, it shines like a little sun.","The ramparts are full of secret nooks. Seagulls hide their treasures there, and I resell them. Shh!"],["Third visit! You\u2019re officially my favorite customer, with yourself in second place.","They say a treasure sleeps under the keep. I say: the real treasure is a fine dried starfish."]]},{name:"Firmin",tone:"po\xE8te",specialty:"Scented sand",lines:[["Come closer, traveler... My scented sand smells of the tide and dreams. Breathe in, and listen.","At night, the keep recites poems to the moon. I gather them grain by grain in my vials."],["Back already? Great minds recognize each other, as grains resemble one another.","Beneath the tunnels flows a river of fine sand. That\u2019s where I draw my finest scents."],["Three times you came, and three times the wind turned. The sand remembers, and so do I.",'The lord himself ordered a scent from me: "the smell of victory." I put in salt, sunshine, and a little bit of me.']]},{name:"Rosalie",tone:"r\xE2leur",specialty:"Mother-of-pearl buttons",lines:[["Yes, what? My buttons are genuine mother-of-pearl, and no, I don\u2019t do credit.","The portcullis screeches, the seagulls scream, customers haggle... what times we live in!"],["You again? Fine, look, but with your eyes. Claws are for paying.","The keep\u2019s kitchens smell great, but we\u2019re never invited. Scandalous, I tell you!"],["You know what? You\u2019re less annoying than the others. That\u2019s a compliment, enjoy it.","The lord\u2019s treasure? Gold buttons, apparently. I say: mother-of-pearl is better. It doesn\u2019t rust."]]},{name:"Hector",tone:"timide",specialty:"Twine and rope",lines:[["Um... hi... I\u2019ve got twine... and rope... if you ever need some...","I stay near the ramparts, it\u2019s quiet... well, when the seagulls aren\u2019t screaming too much..."],["Oh... you came back... That\u2019s nice... Here, a twine as a gift... well, almost a gift...","The tunnels scare me a little... They say you can hear footsteps down there... well, that\u2019s what they say..."],["Three visits... You\u2019re my best customer... well, my only regular...","One day I\u2019ll fix the portcullis with my ropes. It\u2019ll stop screeching. Well... I hope..."]]},{name:"Prunelle",tone:"vantard",specialty:"Sea-polished glass",lines:[["Admire! My polished glass is the shiniest in the castle. No, on the beach. No, in the world!","The lord himself almost bought my whole stock. He hesitated. His mistake."],["Back? Of course, you don\u2019t find quality like this twice. Well, except at my place.","I climbed the keep once. Well, almost. I touched the first stone. With my claw."],["Third visit! Soon they\u2019ll tell your story: the crab with taste.","The castle\u2019s treasure? I polished it, obviously. Without me it wouldn\u2019t shine half as bright."]]},{name:"Isidore",tone:"philosophe",specialty:"Old bottle caps",lines:[["Every cap lived a life before you. Meditate on that, young crab.","The portcullis rises and falls, like our certainties. Only the sand remains."],["You return: the first lesson must have borne fruit. Or you were bored.","The keep is tall because dreams are. The tunnels are deep because fears are."],["Three visits, three truths: time passes, sand remains, and my caps are superb.","The lord seeks a treasure. But does he seek it outside, or within himself?... Word is it\u2019s under the keep."]]},{name:"Marius",tone:"blagueur",specialty:"Seagull feathers",lines:[["Seagull feathers! Soft, light, and guaranteed seagull-free. Well, almost.","Why does the portcullis screech? Because nobody ever told it a joke. It\u2019s tense, poor thing!"],["You\u2019re back! Know the difference between a seagull and a merchant? The seagull leaves for winter!","The ramparts are guarded by very serious crabs. I make them laugh, that\u2019s my contribution to the defense."],["Third visit! At this rate I\u2019ll have to make you a loyalty card. Out of feathers, obviously.","The keep\u2019s treasure? It\u2019s all a joke... well, I hope, because I\u2019ve already dug everywhere."]]},{name:"S\xE9raphine",tone:"bavarde",specialty:"Pins and charms",lines:[["Oh, a customer! So, my pins come from everywhere: this one from a box, that one from a shipwreck, and this one... oh, want me to go on? Because I can go on!","The portcullis, believe it or not, was forged by the blacksmith\u2019s grandfather who... well, that\u2019s what I was told, and I\u2019m told a lot of things!"],["You\u2019re back! Sit down, I have a thousand things to tell you: first the kitchens, then the tunnels, then... what, you\u2019re leaving already? No? Great!","The seagulls tell me everything, you know. They saw the lord in his pajamas. Well, that\u2019s what they say, seagulls exaggerate a little."],["Third visit! You\u2019re my favorite audience, you never interrupt me. Well, you can\u2019t, I talk too fast!","The treasure? I was told it\u2019s under the keep, but I was also told it\u2019s in my stall, so... oh, look at this charm!"]]},{name:"Anatole",tone:"nostalgique",specialty:"Bits of fishing net",lines:[["My nets caught wonders, back in the day... These days they only catch dust.","The portcullis used to open for knights. Now it opens for seaweed deliverers. It was better before."],["Back again, kid... You remind me of me, at your age. Well, younger.","The tunnels used to ring with songs. Now all you hear is the wind. And barely that."],["Three visits... You know, it warms my heart. Like before, when the courtyard was full.","The lord\u2019s treasure? In my day, treasure was friends. Well, and a little gold too, let\u2019s not overdo it."]]}],l.merchantPos=[];for(let ut=0;ut<Kn.length;ut++)l.merchantPos.push([Le[ut].x,Le[ut].z]);l.merchantVisits=new Array(Kn.length).fill(0),l.merchantCooldown=new Array(Kn.length).fill(0),l.updates.push(ut=>{if(!l.castleFound||!l.sand)return;const Dt=l.time,qt=l.crab;for(let Rt=0;Rt<Le.length;Rt++){const V=Le[Rt];let ne=0;if(V.walker)if(V.state==="regarde")V.stateT-=ut,V.yaw=Vn(V.yaw,V.faceYaw,Math.min(1,ut*4)),V.stateT<=0&&(V.state="marche",V.wp=(V.wp+1)%V.wps.length);else{const _=V.wps[V.wp],it=_.x-V.x,Yt=_.z-V.z,ct=Math.sqrt(it*it+Yt*Yt);if(ct<.45)_.visit?(V.state="regarde",V.stateT=3+V.rnd()*3,V.faceYaw=Math.atan2(_.sx-V.x,_.sz-V.z)):V.wp=(V.wp+1)%V.wps.length;else{ne=1;const At=Math.min(ct,.35*ut),Qt=1/(ct||1e-6);let bt=V.x+it*Qt*At,we=V.z+Yt*Qt*At;const Ee=l.ARENA_CIRCLE,oa=!!(l.boss&&(l.boss.phase==="fight"||l.boss.phase==="bossIntro"||l.boss.phase==="transition"));if(Ee&&oa){const de=bt-Ee.x,Ye=we-Ee.z,Pt=Math.sqrt(de*de+Ye*Ye),Xt=Ee.r+.8;if(Pt<Xt){const Ht=Xt/(Pt||1e-6);bt=Ee.x+de
